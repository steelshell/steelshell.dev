<style>
@font-face { font-family: "Plex"; src: url("/link/fonts/IBMPlexSans-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Plex"; src: url("/link/fonts/IBMPlexSans-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
@font-face { font-family: "JBMono"; src: url("/link/fonts/JetBrainsMono-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }
:root {
  --chrome: #0c0d0f; --canvas: #141517; --card: #191a1d; --raised: #1e2023; --tile: #232528;
  --border: #26282b; --border-strong: #34363a; --text: #e8e9eb; --muted: #9b9ea4; --faint: #6d7077;
  --brand: #3dd598; --on-brand: #04150e; --brand-soft: rgba(61, 213, 152, 0.12);
  --danger: #f2626a; --danger-soft: rgba(242, 98, 106, 0.12); --warning: #f5b544;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: radial-gradient(1200px 600px at 50% -10%, rgba(61, 213, 152, 0.07), transparent 60%), var(--chrome);
  color: var(--text);
  font: 15px/1.5 "Plex", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: max(32px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
}
.brand { display: flex; align-items: center; gap: 12px; margin: 8px 0 28px; }
.brand img { width: 40px; height: 40px; border-radius: 10px; }
.brand span { font-weight: 600; font-size: 19px; letter-spacing: 0.2px; }
.card {
  width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 28px 24px 24px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
  animation: rise 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } }
h1 { font-size: 22px; line-height: 1.3; font-weight: 600; margin: 0 0 8px; text-wrap: balance; }
p { margin: 0 0 16px; color: var(--muted); }
p strong { color: var(--text); font-weight: 600; }
.device {
  display: flex; gap: 14px; align-items: center; padding: 14px; margin: 18px 0;
  background: var(--canvas); border: 1px solid var(--border); border-radius: 12px;
}
.device .glyph {
  flex: none; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
  background: var(--brand-soft); color: var(--brand); font: 500 15px "JBMono", ui-monospace, monospace;
}
.device .name { font-weight: 600; word-break: break-word; }
.device .meta { color: var(--muted); font-size: 13px; }
.code {
  display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 4px 0 20px;
  padding: 14px; border-radius: 12px; border: 1px dashed var(--border-strong);
}
.code b { font: 500 26px/1.2 "JBMono", ui-monospace, monospace; letter-spacing: 4px; color: var(--brand); }
.code small { color: var(--faint); font-size: 12.5px; text-align: center; }
label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
input {
  width: 100%; padding: 12px 14px; margin: 0 0 14px; border-radius: 10px; border: 1px solid var(--border-strong);
  background: var(--canvas); color: var(--text); font: inherit; outline: none; transition: border-color 120ms;
}
input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
button {
  width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid transparent; cursor: pointer;
  font: 600 15px "Plex", system-ui, sans-serif; transition: filter 120ms, background 120ms;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 46px;
}
button:disabled { cursor: progress; opacity: 0.75; }
.primary { background: var(--brand); color: var(--on-brand); }
.primary:hover:not(:disabled) { filter: brightness(1.06); }
.secondary { background: transparent; color: var(--text); border-color: var(--border-strong); margin-top: 10px; }
.secondary:hover:not(:disabled) { background: var(--raised); }
.danger-link {
  background: none; border: none; color: var(--faint); font-weight: 400; font-size: 13.5px;
  margin-top: 12px; min-height: 0; padding: 6px;
}
.danger-link:hover { color: var(--danger); }
.error {
  background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 10px 12px;
  font-size: 14px; margin: 0 0 14px;
}
.note { font-size: 13px; color: var(--faint); margin: 16px 0 0; display: flex; gap: 8px; }
.note::before { content: ""; flex: none; width: 14px; height: 14px; margin-top: 3px; background: currentColor; -webkit-mask: url("/link/lock.svg") center / contain no-repeat; mask: url("/link/lock.svg") center / contain no-repeat; }
.timer { text-align: center; font-size: 12.5px; color: var(--faint); margin-top: 14px; font-variant-numeric: tabular-nums; }
.status { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; margin: 0 0 16px; font-size: 26px; }
.status.ok { background: var(--brand-soft); color: var(--brand); }
.status.no { background: var(--danger-soft); color: var(--danger); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 700ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { display: grid; place-items: center; min-height: 160px; color: var(--muted); }
footer { margin-top: 24px; color: var(--faint); font-size: 12.5px; text-align: center; }
footer a { color: var(--muted); }
</style>
